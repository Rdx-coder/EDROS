name: EDROS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Quality Gate: Linting, Type-checking, and Static Application Security Testing (SAST)
  quality-gate:
    name: Build & Code Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Types & Compilation
        run: npm run lint

      - name: Execute Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Static Analysis (CodeQL)
        uses: github/codeql-action/init@v3
        with:
          languages: 'typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 2. Testing Phase: Running Unit, Domain, and Integration Tests
  test-suite:
    name: Core Test Suites
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest/Vitest Test Suites
        run: npm run test:coverage
        continue-on-error: false

      - name: Archive Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: edros-coverage-report-cd
          path: coverage/
          if-no-files-found: ignore

  # 3. Deliverable Creation: Secure Docker Containership Build
  package-and-push:
    name: Build and Push Docker Container
    needs: test-suite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Google Cloud SDK
        uses: google-github-actions/auth@v2
        id: auth
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'edros-ci-cd-builder@edros-prod.iam.gserviceaccount.com'

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Construct & Tag Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            asia-east1-docker.pkg.dev/edros-prod/images/edros-core:latest
            asia-east1-docker.pkg.dev/edros-prod/images/edros-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. GitOps Deployment: Automated rollout to Kubernetes/Cloud Run clusters
  deploy-production:
    name: Continuous Deployment to Production (Cloud Run/GKE)
    needs: package-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Ops Manifesto
        uses: actions/checkout@v4
        with:
          repository: 'edros-org/edros-gitops-manifests'
          token: ${{ secrets.GITOPS_REPO_PAT }}

      - name: Update Kubernetes/Cloud Run Deployment Manifest with New Tag
        run: |
          sed -i 's|image: asia-east1-docker.pkg.dev/edros-prod/images/edros-core:.*|image: asia-east1-docker.pkg.dev/edros-prod/images/edros-core:${{ github.sha }}|g' k8s/production/deployment.yaml
          git config --global user.name "EDROS Deployment Agent"
          git config --global user.email "deploy-bot@edros.net"
          git commit -am "chore(deploy): Rollout version tag ${{ github.sha }} to production"
          git push origin main
