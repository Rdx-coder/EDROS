# EDROS Continuous Integration & Code Quality Pipeline
# High-fidelity security scans, type integrity, container scanning, and deployment orchestration

name: EDROS CI/CD Engine

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to trigger (deploy or rollback)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      target_env:
        description: 'Deployment Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      rollback_version:
        description: 'Docker tag/git SHA to rollback to'
        required: false
        type: string

jobs:
  static-analysis:
    name: Lint & Typings Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: npm ci

      - name: ESLint Static Analysis
        run: npm run lint --if-present

      - name: TypeScript Compiler Type Check
        run: npx tsc --noEmit --skipLibCheck

  unit-integration-tests:
    name: Backend Test Engine & Coverage
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: npm ci

      - name: Execute Vitest Suites with Coverage Thresholds
        run: npx vitest run --coverage

      - name: Archive Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: edros-coverage-report
          path: coverage/

  security-compliance-scans:
    name: OWASP Security Audit
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Execute NPM Audit Scan
        run: npm audit --audit-level=high --omit=dev || true

  playwright-e2e-tests:
    name: Playwright Multi-browser E2E Suites
    runs-on: ubuntu-latest
    needs: unit-integration-tests
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Run E2E Test Scenarios
        run: npx playwright test

      - name: Archive Playwright Execution Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-compile-and-push:
    name: Dockerize & Secure Container Images
    runs-on: ubuntu-latest
    needs: [playwright-e2e-tests, security-compliance-scans]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile.backend
          push: true
          tags: |
            gcr.io/edros-enterprise/backend:${{ github.sha }}
            gcr.io/edros-enterprise/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile.frontend
          push: true
          tags: |
            gcr.io/edros-enterprise/frontend:${{ github.sha }}
            gcr.io/edros-enterprise/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Queue Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile.worker
          push: true
          tags: |
            gcr.io/edros-enterprise/worker:${{ github.sha }}
            gcr.io/edros-enterprise/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gcr.io/edros-enterprise/backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  continuous-deployment:
    name: Continuous Deployment & Rollback Control
    runs-on: ubuntu-latest
    needs: docker-compile-and-push
    if: always() && (needs.docker-compile-and-push.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup GCloud Authentication / CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: edros-production-cluster
          location: us-central1-a

      # Normal Deployment Loop
      - name: Run Schema Migration Pre-flight check
        if: github.event.inputs.action != 'rollback'
        run: |
          kubectl apply -f devops/k8s/job-migrate.yaml
          kubectl wait --for=condition=complete --timeout=120s job/edros-db-migration -n edros-system

      - name: Apply Enterprise Kubernetes Manifests
        if: github.event.inputs.action != 'rollback'
        run: |
          kubectl apply -f devops/k8s/namespace.yaml
          kubectl apply -f devops/k8s/configmap.yaml
          kubectl apply -f devops/k8s/secrets.yaml
          kubectl apply -f devops/k8s/pv-pvc.yaml
          kubectl apply -f devops/k8s/services.yaml
          kubectl apply -f devops/k8s/network-policy.yaml
          kubectl apply -f devops/k8s/deployment-backend.yaml
          kubectl apply -f devops/k8s/deployment-worker.yaml
          kubectl apply -f devops/k8s/ingress.yaml
          kubectl apply -f devops/k8s/hpa.yaml
          
          # Force deployment container image rotation and update
          kubectl set image deployment/edros-backend core-api=gcr.io/edros-enterprise/backend:${{ github.sha }} -n edros-system
          kubectl set image deployment/edros-worker queue-worker=gcr.io/edros-enterprise/worker:${{ github.sha }} -n edros-system
          kubectl set image deployment/edros-frontend web-server=gcr.io/edros-enterprise/frontend:${{ github.sha }} -n edros-system
          
          # Rollout status validation
          kubectl rollout status deployment/edros-backend -n edros-system --timeout=180s

      # Rollback Pipeline execution if manual trigger or deployment fails
      - name: Automated Fallback Rollback Operations
        if: failure() || github.event.inputs.action == 'rollback'
        run: |
          echo "DANGER: DEPLOYMENT FAILURE OR MANUAL ROLLBACK TRIGGERED! Initiating emergency cluster rollback procedures..."
          
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            echo "Rolling back to user-provided version: ${{ github.event.inputs.rollback_version }}"
            kubectl set image deployment/edros-backend core-api=gcr.io/edros-enterprise/backend:${{ github.event.inputs.rollback_version }} -n edros-system
            kubectl set image deployment/edros-worker queue-worker=gcr.io/edros-enterprise/worker:${{ github.event.inputs.rollback_version }} -n edros-system
            kubectl set image deployment/edros-frontend web-server=gcr.io/edros-enterprise/frontend:${{ github.event.inputs.rollback_version }} -n edros-system
          else
            echo "Rolling back to previous stable GKE revision state..."
            kubectl rollout undo deployment/edros-backend -n edros-system
            kubectl rollout undo deployment/edros-worker -n edros-system
            kubectl rollout undo deployment/edros-frontend -n edros-system
          fi
          
          # Validate successful reversion
          kubectl rollout status deployment/edros-backend -n edros-system --timeout=120s
          echo "Emergency cluster restoration successful."
