apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edros-db-pvc
  namespace: edros-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: premium-rwo # High-speed SSD provisioner
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edros-redis-pvc
  namespace: edros-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 20Gi
