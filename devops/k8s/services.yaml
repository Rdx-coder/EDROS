apiVersion: v1
kind: Service
metadata:
  name: edros-backend-service
  namespace: edros-system
  labels:
    app: edros-backend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http-api
  selector:
    app: edros-backend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: edros-frontend-service
  namespace: edros-system
  labels:
    app: edros-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
  selector:
    app: edros-frontend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: edros-db-service
  namespace: edros-system
  labels:
    app: edros-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: edros-db
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: edros-redis-service
  namespace: edros-system
  labels:
    app: edros-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: edros-redis
  type: ClusterIP
