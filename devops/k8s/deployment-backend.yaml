apiVersion: apps/v1
kind: Deployment
metadata:
  name: edros-backend
  namespace: edros-system
  labels:
    app: edros-backend
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: edros-backend
  template:
    metadata:
      labels:
        app: edros-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: core-api
          image: gcr.io/edros-enterprise/backend:v2.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Needs write access to lock directories or compile templates
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http-api
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: edros-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edros-secrets
                  key: DATABASE_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edros-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: edros-secrets
                  key: JWT_SECRET
            - name: AES_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: edros-secrets
                  key: AES_ENCRYPTION_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: edros-secrets
                  key: GEMINI_API_KEY
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edros-frontend
  namespace: edros-system
  labels:
    app: edros-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: edros-frontend
  template:
    metadata:
      labels:
        app: edros-frontend
    spec:
      containers:
        - name: web-server
          image: gcr.io/edros-enterprise/frontend:v2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
