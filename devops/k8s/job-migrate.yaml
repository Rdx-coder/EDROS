apiVersion: batch/v1
kind: Job
metadata:
  name: edros-db-migration
  namespace: edros-system
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        job: edros-db-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-migrator
          image: gcr.io/edros-enterprise/backend:v2.1.0
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edros-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
