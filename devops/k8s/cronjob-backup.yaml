apiVersion: batch/v1
kind: CronJob
metadata:
  name: edros-db-backup
  namespace: edros-system
spec:
  schedule: "0 2 * * *" # Daily at 02:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: edros-backup-agent
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
          containers:
            - name: backup-runner
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting pg_dump daily backup operations for EDROS production DB..."
                  TIMESTAMP=$(date +%Y%m%d%H%M%S)
                  FILENAME="edros-backup-$TIMESTAMP.sql.gz"
                  pg_dump -h edros-db-service -U $DATABASE_USER -d $DATABASE_DB | gzip > /tmp/$FILENAME
                  echo "Local backup file generated: /tmp/$FILENAME"
                  
                  # Integrate standard backup push commands here. AWS S3 CLI is used below for persistence
                  # aws s3 cp /tmp/$FILENAME s3://$AWS_S3_BUCKET/backups/$FILENAME
                  
                  echo "Backup transaction safely committed."
              envFrom:
                - configMapRef:
                    name: edros-config
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: edros-secrets
                      key: DATABASE_URL # Extracts raw connection string or passwords
          volumes:
            - name: scratch-space
              emptyDir: {}
